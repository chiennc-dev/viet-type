name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test engine, composition sessions, and installer transactions
        run: bash scripts/test.sh
      - name: Build signed universal binaries and package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VietType-${{ matrix.runner }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
